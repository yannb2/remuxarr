name: Build and Deploy

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    release:
        types: [ published ]
    # The upstream sync starts the tests this way; image jobs only run on push and release.
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository_owner }}/remuxarr
    # Tool pins, the same as the ARG lines in Muxarr.Web/Dockerfile (the weekly "Tool updates"
    # workflow bumps both; a test checks they match).
    FFMPEG_VERSION: '9.0'
    MKVTOOLNIX_VERSION: '103.0'
    DOVI_TOOL_VERSION: '2.3.4'
    ALASS_VERSION: '2.0.0'
    DOTNET_VERSION: '10.0.x'

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                # No macOS on the fork: hosted macOS arm64 runners are capacity
                # limited, the job was never picked up and its cancel skipped the
                # image build. The image is Linux only; upstream still tests macOS.
                os: [ ubuntu-24.04, ubuntu-24.04-arm, windows-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@v7
                with:
                    submodules: true

            # Fork: the weekly tool update script, and the pins here matching the Dockerfile's.
            -   name: Tool update script tests
                if: runner.os == 'Linux'
                run: python3 -I -m unittest discover -s .github/scripts -p 'test_*.py' -v

            # Same repo and version as the image, not Ubuntu's v82 from 2024.
            -   name: Install mkvtoolnix ${{ env.MKVTOOLNIX_VERSION }} (Linux)
                if: runner.os == 'Linux'
                run: |
                    set -euo pipefail
                    . /etc/os-release
                    sudo curl -fsSL https://mkvtoolnix.download/gpg-pub-moritzbunkus.gpg -o /usr/share/keyrings/mkvtoolnix.gpg
                    gpg --show-keys --with-colons /usr/share/keyrings/mkvtoolnix.gpg | grep -q '^fpr:::::::::D9199745B0545F2E8197062B0F92290A445B9007:'
                    echo "deb [signed-by=/usr/share/keyrings/mkvtoolnix.gpg] https://mkvtoolnix.download/ubuntu/ ${VERSION_CODENAME} main" | sudo tee /etc/apt/sources.list.d/mkvtoolnix.list
                    sudo apt-get update
                    newest=$(apt-cache madison mkvtoolnix | awk -F'|' 'NR==1 {gsub(/ /, "", $2); print $2}')
                    case "$newest" in
                      "${MKVTOOLNIX_VERSION}"-*) ;;
                      *) echo "::notice title=MKVToolNix update available::Pinned ${MKVTOOLNIX_VERSION}, repo has ${newest}" ;;
                    esac
                    sudo apt-get install -y --no-install-recommends "mkvtoolnix=${MKVTOOLNIX_VERSION}-*"
                    mkvmerge --version

            -   name: Install ffmpeg ${{ env.FFMPEG_VERSION }} (Linux)
                if: runner.os == 'Linux'
                run: |
                    set -euo pipefail
                    case "$(uname -m)" in
                      x86_64)  btbn_arch=linux64 ;;
                      aarch64) btbn_arch=linuxarm64 ;;
                      *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
                    esac
                    url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n${FFMPEG_VERSION}-latest-${btbn_arch}-gpl-${FFMPEG_VERSION}.tar.xz"
                    curl -fsSL "$url" -o /tmp/ffmpeg.tar.xz
                    sudo tar -xJf /tmp/ffmpeg.tar.xz -C /usr/local/bin --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
                    ffmpeg -version | head -1

            # Same release the Docker image downloads, so a bad version or URL fails here first.
            -   name: Install dovi_tool ${{ env.DOVI_TOOL_VERSION }} (Linux)
                if: runner.os == 'Linux'
                run: |
                    set -euo pipefail
                    case "$(uname -m)" in
                      x86_64)  target=x86_64-unknown-linux-musl ;;
                      aarch64) target=aarch64-unknown-linux-musl ;;
                      *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
                    esac
                    url="https://github.com/quietvoid/dovi_tool/releases/download/${DOVI_TOOL_VERSION}/dovi_tool-${DOVI_TOOL_VERSION}-${target}.tar.gz"
                    curl -fsSL "$url" -o /tmp/dovi_tool.tar.gz
                    sudo tar -xzf /tmp/dovi_tool.tar.gz -C /usr/local/bin
                    dovi_tool --version

            -   name: Install mkvtoolnix + ffmpeg (macOS)
                if: runner.os == 'macOS'
                run: |
                    set -euo pipefail
                    # The runner image ships an untrusted tap that brew now warns about on every call.
                    brew untap aws/tap 2>/dev/null || true
                    brew install mkvtoolnix ffmpeg
                    # Production and the other runners are on ffmpeg 8.1; fail fast if
                    # brew is behind (the MP4 udta.name round-trip is broken pre-8.0).
                    major=$(ffmpeg -version | awk 'NR==1 {split($3,v,"."); print v[1]}')
                    if [ "$major" -lt 8 ]; then
                      echo "ffmpeg $major is too old; need >= 8.x for MP4 title round-trip" >&2
                      exit 1
                    fi
                    ffmpeg -version | head -1

            -   name: Install mkvtoolnix + ffmpeg (Windows)
                if: runner.os == 'Windows'
                run: |
                    function Install-WithRetry([string]$Package, [scriptblock]$Verify) {
                      for ($i = 1; $i -le 3; $i++) {
                        choco install $Package -y --no-progress
                        if (& $Verify) { return }
                        Write-Warning "$Package attempt $i failed, retrying in 10s..."
                        Start-Sleep -Seconds 10
                      }
                      throw "Failed to install $Package after 3 attempts"
                    }

                    Install-WithRetry 'mkvtoolnix' { Test-Path "C:\Program Files\MKVToolNix\mkvmerge.exe" }
                    echo "C:\Program Files\MKVToolNix" >> $env:GITHUB_PATH

                    Install-WithRetry 'ffmpeg' { Get-Command ffmpeg -ErrorAction SilentlyContinue }
                    $major = (ffmpeg -version | Select-Object -First 1) -replace '.*ffmpeg version (\d+)\..*','$1'
                    if ([int]$major -lt 8) { throw "ffmpeg $major is too old; need >= 8.x for MP4 title round-trip" }
                    ffmpeg -version | Select-Object -First 1

            -   name: Setup .NET 10
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}

            -   name: Run Tests
                run: dotnet test --configuration Release

    build:
        name: build (${{ matrix.arch }})
        needs: test
        if: github.event_name == 'push' || github.event_name == 'release'
        strategy:
            matrix:
                include:
                    -   platform: linux/amd64
                        arch: amd64
                        runner: ubuntu-24.04
                    -   platform: linux/arm64
                        arch: arm64
                        runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write

        steps:
            -   name: Lowercase image name
                run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

            -   name: Checkout code
                uses: actions/checkout@v7
                with:
                    submodules: true

            -   name: Setup .NET 10
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: ${{ env.DOTNET_VERSION }}

            -   name: Publish .NET app
                run: dotnet publish Muxarr.Web/Muxarr.Web.csproj -c Release -o Muxarr.Web/publish

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Log in to Container Registry
                uses: docker/login-action@v4
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Extract metadata
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

            -   name: Build and push by digest
                id: build
                uses: docker/build-push-action@v7
                with:
                    context: Muxarr.Web
                    platforms: ${{ matrix.platform }}
                    build-args: |
                        FFMPEG_VERSION=${{ env.FFMPEG_VERSION }}
                        MKVTOOLNIX_VERSION=${{ env.MKVTOOLNIX_VERSION }}
                        DOVI_TOOL_VERSION=${{ env.DOVI_TOOL_VERSION }}
                        ALASS_VERSION=${{ env.ALASS_VERSION }}
                    labels: ${{ steps.meta.outputs.labels }}
                    outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
                    cache-from: type=gha,scope=${{ matrix.platform }}
                    cache-to: type=gha,scope=${{ matrix.platform }},mode=max

            -   name: Export digest
                run: |
                    mkdir -p /tmp/digests
                    digest="${{ steps.build.outputs.digest }}"
                    touch "/tmp/digests/${digest#sha256:}"

            -   name: Upload digest
                uses: actions/upload-artifact@v7
                with:
                    name: digests-${{ matrix.arch }}
                    path: /tmp/digests/*
                    if-no-files-found: error
                    retention-days: 1

    manifest:
        needs: build
        if: github.event_name == 'push' || github.event_name == 'release'
        runs-on: ubuntu-24.04
        env:
            DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        permissions:
            contents: read
            packages: write

        steps:
            -   name: Lowercase image name
                run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

            -   name: Download digests
                uses: actions/download-artifact@v8
                with:
                    path: /tmp/digests
                    pattern: digests-*
                    merge-multiple: true

            -   name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4

            -   name: Log in to Container Registry
                uses: docker/login-action@v4
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            # Forks without Docker Hub secrets publish to ghcr.io only.
            -   name: Log in to Docker Hub
                if: env.DOCKERHUB_USERNAME != ''
                uses: docker/login-action@v4
                with:
                    username: ${{ secrets.DOCKERHUB_USERNAME }}
                    password: ${{ secrets.DOCKERHUB_TOKEN }}

            -   name: Extract metadata
                id: meta
                uses: docker/metadata-action@v6
                with:
                    images: |
                        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                        name=docker.io/${{ env.IMAGE_NAME }},enable=${{ env.DOCKERHUB_USERNAME != '' }}
                    tags: |
                        type=raw,value=dev,enable=${{ github.event_name == 'push' }}
                        type=raw,value=latest,enable=${{ github.event_name == 'release' }}
                        type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
                        type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
                        type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && !startsWith(github.ref, 'refs/tags/v0.') }}
                        type=sha

            -   name: Create manifest list and push
                working-directory: /tmp/digests
                run: |
                    docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                      $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

            -   name: Inspect image
                run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

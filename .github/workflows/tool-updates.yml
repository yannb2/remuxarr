name: Tool updates

# Once a week, looks for newer FFmpeg, MKVToolNix, dovi_tool and alass versions and opens (or updates)
# a pull request that bumps the pins (the ARG lines in Muxarr.Web/Dockerfile and the
# env block of build-and-deploy.yml, kept in step).
# The build on that branch is the test; nothing merges on its own.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests" turned on, or the PR step fails.

on:
  schedule:
    # Mondays 10:15 UTC.
    - cron: '15 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: tool-updates
  cancel-in-progress: false

env:
  BRANCH: tool-updates

jobs:
  bump:
    # Not on forks. Both names, so the weekly run keeps going across the muxarr -> remuxarr repo rename.
    if: contains(fromJSON('["yannb2/remuxarr", "yannb2/muxarr"]'), github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Look for newer tools
        id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/bump_tools.py | tee summary.md

      - name: Push the branch
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "Update tools: ${{ steps.bump.outputs.tools }}"
          git push --force origin "$BRANCH"

      - name: Open or update the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLS: ${{ steps.bump.outputs.tools }}
        run: |
          {
            echo "Newer tool versions for the image."
            echo
            cat summary.md
            echo
            echo "Merge once the build is green, then pull \`ghcr.io/yannb2/remuxarr:dev\` on the media VM."
            echo "A new FFmpeg release branch (9.0 to 9.1...) is worth a look at its release notes first."
          } > body.md
          existing=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Update tools: $TOOLS" --body-file body.md
          else
            gh pr create --head "$BRANCH" --base master --title "Update tools: $TOOLS" --body-file body.md
          fi

      # Pull requests opened with the workflow token don't start other workflows,
      # so start the build on the branch explicitly.
      - name: Build on the branch
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-and-deploy.yml --ref "$BRANCH"
